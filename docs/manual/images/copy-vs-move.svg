<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Copy keeps the original; move changes location</title>
  <desc id="description">Two diagrams show a source folder and destination folder. Copy leaves the original in the source and makes another copy in the destination. Move removes the item from the source and puts it in the destination.</desc>
  <rect width="960" height="540" rx="24" fill="#f3f7fa"/>
  <g font-family="system-ui, sans-serif" fill="#202a35">
    <text x="52" y="60" font-size="31" font-weight="700">COPY — keep both versions</text>
    <text x="52" y="96" font-size="19">The original stays where it is; a second item is made.</text>
    <rect x="58" y="133" width="280" height="224" rx="16" fill="#fff" stroke="#8093a2" stroke-width="3"/>
    <rect x="622" y="133" width="280" height="224" rx="16" fill="#fff" stroke="#8093a2" stroke-width="3"/>
    <text x="198" y="171" text-anchor="middle" font-size="21" font-weight="700">Source folder</text>
    <text x="762" y="171" text-anchor="middle" font-size="21" font-weight="700">Destination folder</text>
    <rect x="109" y="206" width="178" height="72" rx="12" fill="#d9eee9"/>
    <text x="198" y="250" text-anchor="middle" font-size="20" font-weight="700">photo.jpg</text>
    <path d="M360 242h207" stroke="#0c6b65" stroke-width="8" stroke-linecap="round"/>
    <path d="m546 224 24 18-24 18" fill="none" stroke="#0c6b65" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="463" y="218" text-anchor="middle" font-size="18" font-weight="700">copy</text>
    <rect x="673" y="206" width="178" height="72" rx="12" fill="#d9eee9"/>
    <text x="762" y="250" text-anchor="middle" font-size="20" font-weight="700">photo.jpg</text>
    <path d="M48 383h864" stroke="#c6d2dc" stroke-width="2"/>
    <text x="52" y="421" font-size="27" font-weight="700">MOVE — change location; no source copy remains</text>
    <rect x="58" y="440" width="280" height="82" rx="16" fill="#fff" stroke="#8093a2" stroke-width="3"/>
    <rect x="622" y="440" width="280" height="82" rx="16" fill="#fff" stroke="#8093a2" stroke-width="3"/>
    <text x="198" y="471" text-anchor="middle" font-size="18" font-weight="700">Source folder</text>
    <text x="762" y="471" text-anchor="middle" font-size="18" font-weight="700">Destination folder</text>
    <text x="198" y="506" text-anchor="middle" font-size="16" fill="#526170">photo.jpg is gone</text>
    <rect x="686" y="480" width="152" height="32" rx="8" fill="#d9eee9"/>
    <text x="762" y="502" text-anchor="middle" font-size="16" font-weight="700">photo.jpg</text>
    <path d="M360 492h207" stroke="#b57a00" stroke-width="8" stroke-linecap="round"/>
    <path d="m546 474 24 18-24 18" fill="none" stroke="#b57a00" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
