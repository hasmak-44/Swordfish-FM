name: Portable build artifacts

on:
  push:
    tags:
      - "swordfish-[0-9]*"
      - "SwordFish-Portable-*"
      - "swordfish-portable-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing swordfish-*, Swordfish-Portable-* or swordfish-portable-* tag
        required: true
        type: string

concurrency:
  group: portable-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-portable:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            SwordFish-Portable-*) version=${RELEASE_TAG#SwordFish-Portable-} ;;
            swordfish-portable-*) version=${RELEASE_TAG#swordfish-portable-} ;;
            swordfish-[0-9]*) version=${RELEASE_TAG#swordfish-} ;;
            *) version= ;;
          esac
          if [[ -z "$version" || ! "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
            printf 'Not a Swordfish release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          # A stable tag must match the version the program reports.
          if [[ "$RELEASE_TAG" == swordfish-[0-9]* ]]; then
            app_version=$(sed -n 's/^AC_INIT(\[swordfish\],\[\([^]]*\)\]).*/\1/p' configure.ac)
            if [[ "$app_version" != "$version" ]]; then
              printf 'Tag version %s does not match configure.ac version %s\n' \
                "$version" "$app_version" >&2
              exit 1
            fi
          fi
          prerelease=false
          if [[ "$version" =~ (rc|test|preview|beta|alpha) ]]; then
            prerelease=true
          fi
          printf 'tag=%s\nversion=%s\nprerelease=%s\n' \
            "$RELEASE_TAG" "$version" "$prerelease" >> "$GITHUB_OUTPUT"

      - name: Build portable bundle
        run: ./portable/build-portable.sh

      - name: Package release files
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          name="Swordfish-Portable-$RELEASE_VERSION"
          out=build/release
          mkdir -p "$out/stage"
          cp -a build/Swordfish-Portable "$out/stage/$name"
          # The build script creates portable-data; users' own data must
          # never be replaced by a download, so it is not shipped.
          rm -rf "$out/stage/$name/portable-data"
          (cd "$out/stage" && zip -qry "../$name.zip" "$name")
          tar -C "$out/stage" -czf "$out/$name.tar.gz" "$name"
          git archive --format=tar.gz --prefix="Swordfish-FM-$RELEASE_VERSION/" \
            -o "$out/Swordfish-FM-$RELEASE_VERSION-source.tar.gz" HEAD
          if unzip -l "$out/$name.zip" | grep -q '/portable-data/'; then
            printf 'portable-data must not be packaged\n' >&2
            exit 1
          fi
          (cd "$out" && sha256sum "$name.zip" "$name.tar.gz" \
            "Swordfish-FM-$RELEASE_VERSION-source.tar.gz" \
            > "Swordfish-$RELEASE_VERSION-SHA256SUMS")
          rm -rf "$out/stage"
          cat "$out/Swordfish-$RELEASE_VERSION-SHA256SUMS"

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          awk -v head="## $RELEASE_TAG" '
            index($0, head) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > build/release-notes.md
          if ! grep -q '[^[:space:]]' build/release-notes.md; then
            printf 'Portable Linux x86_64 build of %s.\n' "$RELEASE_TAG" \
              > build/release-notes.md
          fi

      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=()
            if [[ "$PRERELEASE" == true ]]; then
              flags+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "Swordfish $RELEASE_VERSION" \
              --notes-file build/release-notes.md "${flags[@]}"
          fi
          # Never replace or mix with files already on a release: a
          # hand-checked release keeps exactly the files that were verified.
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for file in build/release/*; do
            if grep -Fxq "$(basename "$file")" <<<"$existing"; then
              printf 'Release already has %s; leaving its files unchanged.\n' \
                "$(basename "$file")"
              exit 0
            fi
          done
          gh release upload "$RELEASE_TAG" build/release/*

      - name: Upload build for download from the Actions page
        uses: actions/upload-artifact@v4
        with:
          name: Swordfish-Portable-${{ steps.release.outputs.version }}-linux-x86_64
          path: build/release/*
          if-no-files-found: error
          retention-days: 90
