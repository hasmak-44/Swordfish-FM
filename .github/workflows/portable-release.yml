name: Portable build artifacts

on:
  push:
    tags:
      - "SwordFish-Portable-*"
      - "swordfish-portable-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Swordfish-Portable-* or swordfish-portable-* tag
        required: true
        type: string

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-portable:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate portable tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            SwordFish-Portable-*)
              version=${RELEASE_TAG#SwordFish-Portable-}
              ;;
            swordfish-portable-*)
              version=${RELEASE_TAG#swordfish-portable-}
              ;;
            *)
              version=
              ;;
          esac
          if [[ -z "$version" ]]; then
            printf 'Not a portable release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          printf 'tag=%s\nversion=%s\n' "$RELEASE_TAG" "$version" >> "$GITHUB_OUTPUT"

      - name: Build portable bundle
        run: ./portable/build-portable.sh

      - name: Prepare portable folder for download
        run: |
          mkdir -p build/portable-download
          cp -a build/Swordfish-Portable build/portable-download/
          mkdir -p build/pages
          (cd build && zip -qr pages/Swordfish-Portable.zip Swordfish-Portable)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: Swordfish-Portable-${{ steps.release.outputs.version }}-linux-x86_64
          path: build/portable-download/*
          if-no-files-found: error
          retention-days: 90

      - name: Deploy latest portable download
        id: deploy-pages
        uses: actions/deploy-pages@v4
