name: Portable build artifacts

on:
  push:
    tags:
      - "swordfish-[0-9]*"
      - "SwordFish-Portable-*"
      - "swordfish-portable-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing swordfish-*, Swordfish-Portable-* or swordfish-portable-* tag
        required: true
        type: string

concurrency:
  group: portable-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            SwordFish-Portable-*) version=${RELEASE_TAG#SwordFish-Portable-} ;;
            swordfish-portable-*) version=${RELEASE_TAG#swordfish-portable-} ;;
            swordfish-[0-9]*) version=${RELEASE_TAG#swordfish-} ;;
            *) version= ;;
          esac
          if [[ -z "$version" || ! "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
            printf 'Not a Swordfish release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          # A stable tag must match the version the program reports.
          if [[ "$RELEASE_TAG" == swordfish-[0-9]* ]]; then
            app_version=$(sed -n 's/^AC_INIT(\[swordfish\],\[\([^]]*\)\]).*/\1/p' configure.ac)
            if [[ "$app_version" != "$version" ]]; then
              printf 'Tag version %s does not match configure.ac version %s\n' \
                "$version" "$app_version" >&2
              exit 1
            fi
          fi
          prerelease=false
          if [[ "$version" =~ (rc|test|preview|beta|alpha) ]]; then
            prerelease=true
          fi
          printf 'tag=%s\nversion=%s\nprerelease=%s\n' \
            "$RELEASE_TAG" "$version" "$prerelease" >> "$GITHUB_OUTPUT"

  build-portable:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: i386
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          # GitHub's ARM runners cannot execute 32-bit ARM, so armhf is emulated.
          - arch: armhf
            runner: ubuntu-24.04-arm
            qemu: arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up QEMU emulation
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.qemu }}

      - name: Build portable bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: ./portable/build-portable.sh "build/Swordfish-Portable-$ARCH"

      - name: Diagnose ARM certificate failure
        if: failure() && matrix.arch == 'armhf'
        run: |
          image=swordfish-portable-builder:debian-buster-slim-armhf
          for user in 0 "$(id -u):$(id -g)"; do
            echo "Testing certificate trust as $user"
            if docker run --rm --platform linux/arm/v7 --user "$user" "$image" \
              sh -c 'date -u; ls -l /etc/ssl/certs/ca-certificates.crt; curl -vI https://github.com'; then
              echo "Certificate check succeeded as $user"
            else
              echo "Certificate check failed as $user"
            fi
          done

      - name: Package release files
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          name="Swordfish-Portable-$RELEASE_VERSION-$ARCH"
          out=build/release
          mkdir -p "$out/stage"
          cp -a "build/Swordfish-Portable-$ARCH" "$out/stage/$name"
          # The build script creates portable-data; users' own data must
          # never be replaced by a download, so it is not shipped.
          rm -rf "$out/stage/$name/portable-data"
          # Materialize links: newer 7-Zip rejects ../ icon links in ZIPs.
          (cd "$out/stage" && zip -qr "../$name.zip" "$name")
          unzip -tq "$out/$name.zip"
          tar -C "$out/stage" -czf "$out/$name.tar.gz" "$name"
          if unzip -l "$out/$name.zip" | grep -q '/portable-data/'; then
            printf 'portable-data must not be packaged\n' >&2
            exit 1
          fi
          rm -rf "$out/stage"
          sh packaging/deb-portable/build-deb.sh -a "$ARCH" -o "$out" "$out/$name.tar.gz"
          ls -l "$out"

      - name: Check portable version and Debian installation
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          case "$ARCH" in
            amd64) platform=linux/amd64 ;;
            i386) platform=linux/386 ;;
            armhf) platform=linux/arm/v7 ;;
            arm64) platform=linux/arm64 ;;
          esac
          docker run --rm --platform "$platform" \
            --mount "type=bind,src=$PWD/build/Swordfish-Portable-$ARCH,dst=/bundle" \
            "swordfish-portable-builder:debian-buster-slim-$ARCH" \
            /bundle/AppRun --version | tee build/version.txt
          grep -Fx "swordfish version $RELEASE_VERSION" build/version.txt
          sh tests/run-portable-deb-regression.sh build/release/swordfish-portable_*_"$ARCH".deb

      - name: Upload build for download from the Actions page
        uses: actions/upload-artifact@v4
        with:
          name: Swordfish-Portable-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [prepare, build-portable]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Collect builds for every architecture
        uses: actions/download-artifact@v4
        with:
          pattern: Swordfish-Portable-${{ needs.prepare.outputs.version }}-linux-*
          path: build/release
          merge-multiple: true

      - name: Install source archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint gettext libtool

      - name: Add source archive and checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          out=build/release
          for arch in amd64 i386 armhf arm64; do
            for file in "Swordfish-Portable-$RELEASE_VERSION-$arch.zip" \
                "Swordfish-Portable-$RELEASE_VERSION-$arch.tar.gz"; do
              if [[ ! -f "$out/$file" ]]; then
                printf 'Missing %s\n' "$file" >&2
                exit 1
              fi
            done
            if ! ls "$out"/swordfish-portable_*_"$arch".deb >/dev/null 2>&1; then
              printf 'Missing %s .deb\n' "$arch" >&2
              exit 1
            fi
          done
          source_dir="Swordfish-FM-$RELEASE_VERSION"
          mkdir -p "build/source/$source_dir"
          git archive HEAD | tar -x -C "build/source/$source_dir"
          (cd "build/source/$source_dir" && autoreconf -fi)
          tar --exclude=autom4te.cache --exclude='*~' -C build/source -czf \
            "$out/$source_dir-source.tar.gz" "$source_dir"
          (cd "$out" && sha256sum -- * > "../Swordfish-$RELEASE_VERSION-SHA256SUMS")
          mv "build/Swordfish-$RELEASE_VERSION-SHA256SUMS" "$out/"
          cat "$out/Swordfish-$RELEASE_VERSION-SHA256SUMS"

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Match the whole tag so swordfish-0.0.3 does not also take -beta2's notes.
          awk -v head="## $RELEASE_TAG" '
            !on && ($0 == head || index($0, head " ") == 1) { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > build/release-notes.md
          if ! grep -q '[^[:space:]]' build/release-notes.md; then
            printf 'Portable Linux builds (amd64, i386, armhf, arm64) of %s.\n' "$RELEASE_TAG" \
              > build/release-notes.md
          fi

      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=()
            if [[ "$PRERELEASE" == true ]]; then
              flags+=(--draft --prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "Swordfish $RELEASE_VERSION" \
              --notes-file build/release-notes.md "${flags[@]}"
          fi
          # Never replace or mix with files already on a release: a
          # hand-checked release keeps exactly the files that were verified.
          # Older releases use different file names, so any existing file
          # means the release is already populated.
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if [[ -n "$existing" ]]; then
            printf 'Release already has files; leaving them unchanged:\n%s\n' "$existing"
            exit 0
          fi
          gh release upload "$RELEASE_TAG" build/release/*
